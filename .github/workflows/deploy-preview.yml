name: Deploy preview

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source branch or commit from gitmaruneko/yuban
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: preview-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SOURCE_REF: ${{ inputs.source_ref }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          repository: gitmaruneko/yuban
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Record source version
        run: |
          source_sha="$(git rev-parse HEAD)"
          echo "SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"
          echo "Preview source: $SOURCE_REF ($source_sha)" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Python unit tests
        run: python -m unittest discover -s tests -v

      - name: Run JavaScript unit tests
        run: node --test tests/search-utils.test.mjs

      - name: Validate resource index
        run: python tools/validate_resources.py

      - name: Prepare preview
        run: |
          python - <<'PY'
          import html
          import os
          import re
          from pathlib import Path

          site = Path("website")
          source_ref = os.environ["SOURCE_REF"]
          sha = os.environ["SOURCE_SHA"]
          (site / "preview-version.txt").write_text(sha + "\n", encoding="utf-8")
          (site / "preview-ref.txt").write_text(source_ref + "\n", encoding="utf-8")
          (site / "robots.txt").write_text("User-agent: *\nDisallow: /\n", encoding="utf-8")
          banner = '<div role="note" style="padding:10px;text-align:center;background:#fff3cd;color:#332701">開發預覽版 · ' + html.escape(source_ref) + ' · ' + sha[:7] + ' ｜ <a href="https://gitmaruneko.github.io/yuban/">前往正式網站</a></div>'
          for page in site.rglob("*.html"):
              page_html = page.read_text(encoding="utf-8")
              page_html = re.sub(r"(<head\b[^>]*>)", r'\1<meta name="robots" content="noindex,nofollow">', page_html, count=1, flags=re.I)
              page_html = re.sub(r"(<body\b[^>]*>)", lambda match: match.group(1) + banner, page_html, count=1, flags=re.I)
              page.write_text(page_html, encoding="utf-8")
          PY

      - name: Upload preview artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Check deployed pages
        run: |
          for path in index.html learning-materials/index.html data/sample-resources.json preview-version.txt preview-ref.txt; do
            curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors --max-time 30 "https://gitmaruneko.github.io/yuban-preview/$path" --output /dev/null
          done
